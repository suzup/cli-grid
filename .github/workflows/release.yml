name: Release

# Tag a version to publish it:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint

      - name: Package
        run: npx vsce package --no-dependencies -o cli-grid.vsix

      # Attach the .vsix so people can install without a marketplace account.
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: cli-grid.vsix
          generate_release_notes: true

      # Both registries are optional, so a fork can still cut releases. The
      # condition reads `secrets` directly: a step cannot see its own `env` in
      # `if`, which would silently skip publishing even with the token set.
      #
      # Open VSX comes first because it needs nothing but a GitHub login, while
      # the VS Code Marketplace needs an Azure subscription.
      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        run: npx ovsx publish cli-grid.vsix --pat "${{ secrets.OVSX_PAT }}"

      - name: Publish to the VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath cli-grid.vsix
